<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ziemassvētku Dāvanu Rats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              christmas: ['"Mountains of Christmas"', 'cursive'],
              sans: ['"DM Sans"', 'sans-serif'],
            },
            colors: {
              xmas: {
                red: '#D42426',
                darkRed: '#8B0000',
                green: '#165B33',
                gold: '#F8B229',
                cream: '#F0E68C',
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --forest: #123b2b;
        --paper: #fffdf7;
        --ink: #17392c;
        --muted: #526258;
        --gold: #f3c869;
        --red: #a43636;
      }
      body {
        margin: 0;
        background-color: var(--forest);
        background-image: radial-gradient(ellipse at 50% 0%, #286347 0%, transparent 58%), radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0);
        background-size: auto, 28px 28px;
        min-height: 100vh;
        color: white;
        font-family: 'DM Sans', sans-serif;
      }
      /* Snow effect */
      .snowflake {
        position: fixed;
        top: -10px;
        color: #f8eccb;
        font-size: 1em;
        font-family: sans-serif;
        opacity: .28;
        user-select: none;
        z-index: 0;
        animation-name: snowflakes-fall, snowflakes-shake;
        animation-duration: 16s, 5s;
        animation-timing-function: linear, ease-in-out;
        animation-iteration-count: infinite, infinite;
        animation-play-state: running, running;
      }
      @keyframes snowflakes-fall {
        0% { top: -10%; }
        100% { top: 100%; }
      }
      @keyframes snowflakes-shake {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(80px); }
      }
      
      /* Custom animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes slideInUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      .animate-fadeIn {
        animation: fadeIn 0.35s ease-out;
      }
      
      .animate-popIn {
        animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      
      .animate-slideInUp {
        animation: slideInUp 0.6s ease-out;
      }
      
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      .display-type { font-family: 'Mountains of Christmas', cursive; }
      .surface-panel { border: 1px solid #d6ded7; border-radius: 12px; background: var(--paper); color: var(--ink); box-shadow: 0 18px 48px rgba(4, 25, 17, .22); }
      .eyebrow { color: #86601e; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .field-label { display: block; margin-bottom: .4rem; color: var(--ink); font-size: .875rem; font-weight: 700; }
      .field-control { min-height: 2.75rem; border: 1px solid #aebdb1; border-radius: 8px; background: white; padding: .65rem .8rem; color: var(--ink); font: inherit; }
      .field-control::placeholder { color: #68766d; opacity: 1; }
      .field-control:focus-visible { outline: 3px solid #d8a93f; outline-offset: 2px; border-color: #17392c; }
      .icon-button { display: inline-flex; min-width: 44px; min-height: 44px; align-items: center; justify-content: center; border-radius: 8px; color: inherit; transition: background-color .15s ease; }
      .icon-button:hover { background: rgba(23, 57, 44, .09); }
      .icon-button:focus-visible, .text-button:focus-visible, button:focus-visible { outline: 3px solid #d8a93f; outline-offset: 2px; }
      .action-button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: .5rem; border: 1px solid #cbd5cc; border-radius: 8px; padding: .65rem .8rem; color: var(--ink); font-weight: 600; }
      .action-button:hover { background: #f1f5f0; }
      .action-button-primary { border-color: #1d704e; background: #1d704e; color: white; }
      .action-button-primary:hover { background: #165b3d; }
      .text-button { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; gap: .4rem; border-radius: 6px; padding: .4rem .5rem; font-size: .875rem; font-weight: 600; }
      .text-button:hover { text-decoration: underline; text-underline-offset: 3px; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        .snowflake { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <div aria-hidden="true">
      <div class="snowflake" style="left: 1%; animation-delay: 0s, 0s">❅</div>
      <div class="snowflake" style="left: 10%; animation-delay: 1s, 1s">❆</div>
      <div class="snowflake" style="left: 20%; animation-delay: 6s, .5s">❅</div>
      <div class="snowflake" style="left: 30%; animation-delay: 4s, 2s">❆</div>
      <div class="snowflake" style="left: 40%; animation-delay: 2s, 2s">❅</div>
      <div class="snowflake" style="left: 50%; animation-delay: 8s, 3s">❆</div>
      <div class="snowflake" style="left: 60%; animation-delay: 6s, 2s">❅</div>
      <div class="snowflake" style="left: 70%; animation-delay: 2.5s, 1s">❆</div>
      <div class="snowflake" style="left: 80%; animation-delay: 1s, 0s">❅</div>
      <div class="snowflake" style="left: 90%; animation-delay: 3s, 1.5s">❆</div>
    </div>
  </body>
</html>
