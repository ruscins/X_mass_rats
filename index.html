<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ziemassvētku Dāvanu Rats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              christmas: ['"Mountains of Christmas"', 'cursive'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              xmas: {
                red: '#D42426',
                darkRed: '#8B0000',
                green: '#165B33',
                gold: '#F8B229',
                cream: '#F0E68C',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #8B0000;
        background-image: radial-gradient(circle, #D42426 0%, #8B0000 100%);
        min-height: 100vh;
        color: white;
      }
      /* Snow effect */
      .snowflake {
        position: fixed;
        top: -10px;
        color: #fff;
        font-size: 1em;
        font-family: Arial, sans-serif;
        text-shadow: 0 0 5px #000;
        user-select: none;
        z-index: 0;
        animation-name: snowflakes-fall, snowflakes-shake;
        animation-duration: 10s, 3s;
        animation-timing-function: linear, ease-in-out;
        animation-iteration-count: infinite, infinite;
        animation-play-state: running, running;
      }
      @keyframes snowflakes-fall {
        0% { top: -10%; }
        100% { top: 100%; }
      }
      @keyframes snowflakes-shake {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(80px); }
      }
      
      /* Custom animations */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes slideInUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      .animate-fadeIn {
        animation: fadeIn 0.5s ease-out;
      }
      
      .animate-popIn {
        animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      
      .animate-slideInUp {
        animation: slideInUp 0.6s ease-out;
      }
      
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <div aria-hidden="true">
      <div class="snowflake" style="left: 1%; animation-delay: 0s, 0s">❅</div>
      <div class="snowflake" style="left: 10%; animation-delay: 1s, 1s">❆</div>
      <div class="snowflake" style="left: 20%; animation-delay: 6s, .5s">❅</div>
      <div class="snowflake" style="left: 30%; animation-delay: 4s, 2s">❆</div>
      <div class="snowflake" style="left: 40%; animation-delay: 2s, 2s">❅</div>
      <div class="snowflake" style="left: 50%; animation-delay: 8s, 3s">❆</div>
      <div class="snowflake" style="left: 60%; animation-delay: 6s, 2s">❅</div>
      <div class="snowflake" style="left: 70%; animation-delay: 2.5s, 1s">❆</div>
      <div class="snowflake" style="left: 80%; animation-delay: 1s, 0s">❅</div>
      <div class="snowflake" style="left: 90%; animation-delay: 3s, 1.5s">❆</div>
    </div>
  </body>
</html>
